<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>급식 식단 꾸미기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #fdf2f8; margin: 0; padding: 0; }
        .canvas-container { position: relative; display: inline-block; }
        #canvas-overlay-input { 
            position: absolute; display: none; z-index: 10; 
            border: 2px dashed #f472b6; background: rgba(255,255,255,0.9);
            padding: 4px; font-size: 16px; font-weight: bold; color: #334155;
            outline: none; border-radius: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #paste-area { border: 2px dashed #fbcfe8; outline: none; transition: all 0.2s; }
        #paste-area:focus { border-color: #f472b6; background-color: #fdf2f8; }
        #font-cute { font-family: 'Comic Sans MS', 'Chalkboard SE', 'Pretendard', sans-serif; }
    </style>
</head>
<body>

    <!-- 비밀번호 잠금 화면 -->
    <div id="password-overlay" class="fixed inset-0 bg-pink-50 flex flex-col items-center justify-center z-50">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">🔒 급식 꾸미기 앱</h1>
            <input type="password" id="app-password" 
                   class="w-full border-2 border-pink-200 rounded-lg p-4 text-xl mb-4 focus:outline-none focus:border-pink-500 transition text-center" 
                   placeholder="비밀번호 입력" 
                   onkeypress="if(event.key === 'Enter') checkPassword()">
            <button onclick="checkPassword()" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-bold py-4 px-4 rounded-lg transition text-lg shadow-md">접속하기</button>
        </div>
    </div>

    <!-- 메인 화면 -->
    <div id="main-app" class="max-w-4xl mx-auto p-4 md:p-6 bg-white shadow-xl rounded-2xl my-6 hidden">
        <h1 class="text-3xl font-extrabold text-center text-pink-500 mb-8" id="font-cute">🍽️ 오늘의 식단 꾸미기</h1>

        <!-- 엑셀 연동 영역 -->
        <div class="bg-pink-50 p-4 rounded-xl mb-6">
            <h2 class="text-lg font-bold text-gray-700 mb-2">📅 월간 식단표(Excel)</h2>
            <div class="flex flex-col md:flex-row gap-3 items-center">
                <input type="file" id="excel-upload" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-pink-100 file:text-pink-700 hover:file:bg-pink-200 cursor-pointer">
                <input type="date" id="date-picker" class="border-2 border-pink-200 rounded-lg p-2 w-full md:w-auto">
            </div>
            <p id="excel-status" class="text-sm font-bold mt-2 text-gray-500 hidden"></p>
        </div>

        <!-- 텍스트 입력 영역 -->
        <div class="mb-6">
            <label class="block text-gray-700 font-bold mb-2">오늘의 식단 <span class="text-sm font-normal text-gray-500">(사진 분석 시 참고됩니다)</span></label>
            <textarea id="menu-text" rows="3" class="w-full border-2 border-gray-200 rounded-lg p-3 focus:outline-none focus:border-pink-400" placeholder="예: 찰기장밥, 까르보나라, 도토리묵국..."></textarea>
        </div>

        <!-- 사진 업로드 영역 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div class="border-2 border-dashed border-pink-300 rounded-xl p-6 text-center hover:bg-pink-50 transition cursor-pointer flex flex-col justify-center" onclick="document.getElementById('image-upload').click()">
                <div class="text-3xl mb-2 text-green-600">↑</div>
                <p class="font-bold text-gray-600">사진 업로드</p>
                <input type="file" id="image-upload" accept="image/*" class="hidden">
            </div>
            <div id="paste-area" contenteditable="true" class="rounded-xl p-6 text-center flex flex-col justify-center items-center cursor-text">
                <div class="text-3xl mb-2 text-pink-400">📋</div>
                <p class="font-bold text-gray-600">클릭 후 Ctrl+V<br>(캡쳐 붙여넣기)</p>
            </div>
        </div>

        <button id="transform-btn" onclick="startTransformation()" class="w-full bg-pink-400 hover:bg-pink-500 text-white font-bold py-5 px-6 rounded-xl shadow-lg transition transform hover:scale-[1.01] active:scale-95 text-xl mb-4">
            ✨ 예쁘게 꾸미기 시작! ✨
        </button>

        <!-- 에러 표시 박스 -->
        <div id="error-msg" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative hidden mb-4 text-center font-bold"></div>
        <p id="loading-msg" class="text-center text-pink-500 font-bold text-lg hidden my-4">AI가 이미지를 분석하고 있습니다... ⏳<br><span class="text-sm text-gray-500">(네트워크에 따라 10~20초 소요)</span></p>

        <!-- 결과 영역 -->
        <div id="result-section" class="hidden flex flex-col items-center w-full">
            <div class="canvas-container relative w-full overflow-x-auto text-center flex justify-center">
                <canvas id="result-canvas" class="rounded-xl shadow-xl max-w-full h-auto"></canvas>
                <input type="text" id="canvas-overlay-input">
            </div>
            <p class="text-sm text-gray-500 mt-2 font-bold">💡 이미지 안의 글자를 직접 클릭해 수정 가능</p>

            <div class="w-full bg-gray-50 p-4 rounded-lg mt-4 border border-gray-200">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-bold text-gray-700">📋 등록된 식단 항목</h3>
                    <button onclick="addMenuItem()" class="bg-pink-500 hover:bg-pink-600 text-white font-bold py-1 px-3 rounded-md text-sm transition">
                        + 식단 항목 추가
                    </button>
                </div>
                <div id="menu-items-list" class="flex flex-wrap gap-2"></div>
            </div>

            <div class="flex gap-4 mt-6 w-full">
                <button onclick="startTransformation(true)" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 rounded-lg transition">🔄 다시 분석하기</button>
                <button onclick="downloadImage()" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-lg transition shadow-lg">💾 이미지 저장하기</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. 비밀번호 설정 ---
        const SETTING_PASSWORD = "3230";

        function checkPassword() {
            const inputPw = document.getElementById('app-password').value;
            if (inputPw === SETTING_PASSWORD) {
                document.getElementById('password-overlay').style.display = 'none';
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('date-picker').valueAsDate = new Date();
                restoreLocalData(); // 접속 성공 시 저장된 데이터 복구
            } else {
                alert('비밀번호가 일치하지 않습니다.');
                document.getElementById('app-password').value = '';
            }
        }

        // --- 2. 엑셀 로컬 스토리지 연동 ---
        let monthlyMenuData = {};

        function restoreLocalData() {
            const savedData = localStorage.getItem('monthlyMealData');
            const statusEl = document.getElementById('excel-status');
            if (savedData) {
                try {
                    monthlyMenuData = JSON.parse(savedData);
                    statusEl.innerHTML = "💾 이전에 업로드한 식단표가 자동 적용되었습니다.";
                    statusEl.classList.remove('hidden', 'text-gray-500');
                    statusEl.classList.add('text-green-600');
                    loadMenuForSelectedDate();
                } catch(e) { console.error("데이터 복구 실패"); }
            }
        }

        document.getElementById('excel-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const workbook = XLSX.read(e.target.result, {type: 'array'});
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const json = XLSX.utils.sheet_to_json(sheet, {header: 1});
                
                monthlyMenuData = {};
                for (let i = 0; i < json.length; i++) {
                    for (let j = 0; j < json[i].length; j++) {
                        const cell = String(json[i][j] || '').trim();
                        if (/^\d{1,2}$/.test(cell) && i + 1 < json.length) {
                            const day = parseInt(cell, 10);
                            const menu = String(json[i+1][j] || '').trim();
                            if (menu) monthlyMenuData[day] = menu.replace(/\n/g, ', ');
                        }
                    }
                }
                localStorage.setItem('monthlyMealData', JSON.stringify(monthlyMenuData));
                
                const statusEl = document.getElementById('excel-status');
                statusEl.innerHTML = "✅ 새로운 엑셀 파일이 저장되었습니다!";
                statusEl.classList.remove('hidden');
                statusEl.classList.add('text-green-600');
                loadMenuForSelectedDate();
            };
            reader.readAsArrayBuffer(file);
        });

        document.getElementById('date-picker').addEventListener('change', loadMenuForSelectedDate);

        function loadMenuForSelectedDate() {
            const dateVal = document.getElementById('date-picker').value;
            if(!dateVal || Object.keys(monthlyMenuData).length === 0) return;
            
            const day = new Date(dateVal).getDate();
            document.getElementById('menu-text').value = monthlyMenuData[day] || "해당 날짜의 식단이 없습니다.";
        }

        // --- 3. 이미지 리사이징 및 처리 (Netlify 과부하 방지) ---
        let sourceImage = null;
        let optimizedImageBase64 = null;

        function handleImageSource(file) {
            if(!file || !file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    sourceImage = img;
                    // 서버 전송용으로 해상도를 낮춰 최적화 (가로최대 1000px)
                    optimizedImageBase64 = resizeImageForAPI(img, 1000);
                    document.getElementById('paste-area').innerHTML = "<div class='text-green-500 text-3xl mb-2'>✅</div><p class='font-bold'>이미지 준비 완료</p>";
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }

        function resizeImageForAPI(img, maxWidth) {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
                height = Math.round(height * (maxWidth / width));
                width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            // jpeg 포맷, 0.7 품질로 압축률 상승
            return canvas.toDataURL('image/jpeg', 0.7);
        }

        document.getElementById('image-upload').addEventListener('change', e => handleImageSource(e.target.files[0]));
        document.getElementById('paste-area').addEventListener('paste', e => {
            e.preventDefault();
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let item of items) if (item.kind === 'file') handleImageSource(item.getAsFile());
        });
        window.addEventListener('paste', e => {
            if(document.getElementById('main-app').classList.contains('hidden')) return;
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let item of items) if (item.kind === 'file') handleImageSource(item.getAsFile());
        });

        // --- 4. Netlify Serverless API 연동 ---
        let currentAnnotations = [];

        async function startTransformation(force = false) {
            if (!optimizedImageBase64) {
                alert("사진을 업로드하거나 붙여넣어 주세요!");
                return;
            }

            const errorMsg = document.getElementById('error-msg');
            errorMsg.classList.add('hidden');
            document.getElementById('loading-msg').classList.remove('hidden');
            document.getElementById('result-section').classList.add('hidden');

            try {
                const dateKey = document.getElementById('date-picker').value || 'default';
                const cacheKey = 'ai_result_' + dateKey;
    
        // 강제 분석(force)이 아니고, 저장된 임시 결과가 있다면?
            if (!force && localStorage.getItem(cacheKey)) {
               currentAnnotations = JSON.parse(localStorage.getItem(cacheKey));
               document.getElementById('loading-msg').classList.add('hidden');
               document.getElementById('result-section').classList.remove('hidden');
              renderCanvas();
              updateMenultemsList();
              return; // 🛑 여기서 함수를 종료하여 아래의 API 통신을 아예 건너뜁니다!
            }
                // Netlify 통신 에러 방지를 위해 현재 주소를 기반으로 API URL 생성
                const baseUrl = window.location.origin.includes('localhost') || window.location.origin.includes('file://') 
                    ? 'https://schoolmealtransformer.netlify.app' 
                    : window.location.origin;
                const apiUrl = baseUrl + '/.netlify/functions/gemini';

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        imageBase64: optimizedImageBase64,
                        menuText: document.getElementById('menu-text').value + "\n(중요: 식단이 7~8개 이상일 수 있으니, 누락되는 반찬 없이 사진 속 모든 음식을 빠짐없이 모두 분석해서 결과에 포함해줘.)"
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || '알 수 없는 서버 에러');
                }
                
                if (!Array.isArray(data)) {
                    throw new Error('응답 데이터 구조가 잘못되었습니다. (JSON Array 형태가 아님)');
                }

                currentAnnotations = data.map((item, i) => ({
                    id: Date.now() + i,
                    name: item.name || '메뉴명 없음',
                    desc: item.desc || '설명 없음',
                    x: 0, y: 0
                }));

                document.getElementById('loading-msg').classList.add('hidden');
                document.getElementById('result-section').classList.remove('hidden');
                
                renderCanvas();
                updateMenuItemsList();

            } catch (error) {
                console.error(error);
                document.getElementById('loading-msg').classList.add('hidden');
                
                // HTML 페이지가 반환되었을 때의 에러 메시지 사용자 친화적으로 변경
                if(error.message.includes("is not valid JSON") || error.message.includes("Unexpected token")) {
                    errorMsg.innerHTML = `⚠️ 서버와 연결할 수 없습니다.<br><span class='text-sm font-normal'>Netlify 환경에 배포된 상태인지 확인해주세요. (미리보기 환경에서는 작동하지 않습니다.)</span>`;
                } else {
                    errorMsg.innerHTML = `⚠️ 오류 발생: ${error.message}<br><span class='text-sm font-normal'>다시 시도하거나 이미지를 바꿔보세요.</span>`;
                }
                
                errorMsg.classList.remove('hidden');
            }
        }

        // --- 5. 캔버스 그리기 ---
        function renderCanvas() {
            const canvas = document.getElementById('result-canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = Math.max(1000, sourceImage.width + 300);
            canvas.height = sourceImage.height + 400;

            // 파스텔 배경
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#fef9c3'); 
            gradient.addColorStop(1, '#dcfce3'); 
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 식판 그리기
            const imgX = (canvas.width - sourceImage.width) / 2;
            const imgY = 150;
            ctx.shadowColor = 'rgba(0,0,0,0.2)';
            ctx.shadowBlur = 15;
            ctx.shadowOffsetY = 10;
            ctx.drawImage(sourceImage, imgX, imgY);
            ctx.shadowColor = 'transparent';

            // 제목
            ctx.font = 'bold 40px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillStyle = '#ec4899'; // pink
            ctx.fillText("오늘의 급식 이야기", canvas.width / 2, 80);

            // 좌우 분할 배치
            const leftItems = [], rightItems = [];
            currentAnnotations.forEach((anno, i) => i < currentAnnotations.length / 2 ? leftItems.push(anno) : rightItems.push(anno));

            const drawItems = (items, isLeft) => {
                const xBase = isLeft ? imgX - 120 : imgX + sourceImage.width + 120;
                let startY = 130;
                const yStep = Math.max(120, (sourceImage.height + 100) / Math.max(1, items.length));

                items.forEach((anno, i) => {
                    anno.renderX = xBase;
                    anno.renderY = startY + (i * yStep);
                    
                    // 점선
                    ctx.beginPath();
                    ctx.moveTo(isLeft ? anno.renderX + 80 : anno.renderX - 80, anno.renderY);
                    ctx.lineTo(isLeft ? imgX + 50 : imgX + sourceImage.width - 50, imgY + (sourceImage.height * 0.5));
                    ctx.setLineDash([5, 5]);
                    ctx.strokeStyle = '#94a3b8';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.setLineDash([]); // 초기화

                    // 타이틀 뱃지 배경
                    ctx.fillStyle = '#f97316'; // 주황색
                    if(i%3===1) ctx.fillStyle = '#10b981'; // 초록색
                    if(i%3===2) ctx.fillStyle = '#8b5cf6'; // 보라색
                    roundRect(ctx, anno.renderX - 100, anno.renderY - 35, 200, 45, 20, true, false);

                    // 메뉴명 (흰색)
                    ctx.font = 'bold 22px sans-serif';
                    ctx.fillStyle = 'white';
                    ctx.fillText(anno.name, anno.renderX, anno.renderY - 5);

                    // 설명 텍스트 분할 처리 (자동 줄바꿈 흉내)
                    ctx.font = '18px sans-serif';
                    ctx.fillStyle = '#334155';
                    const words = anno.desc.split(' ');
                    let line = '';
                    let tempY = anno.renderY + 30;
                    
                    for(let n = 0; n < words.length; n++) {
                        let testLine = line + words[n] + ' ';
                        let metrics = ctx.measureText(testLine);
                        if(metrics.width > 240 && n > 0) {
                            ctx.fillText(line, anno.renderX, tempY);
                            line = words[n] + ' ';
                            tempY += 24;
                        } else {
                            line = testLine;
                        }
                    }
                    ctx.fillText(line, anno.renderX, tempY);
                });
            };

            drawItems(leftItems, true);
            drawItems(rightItems, false);

            // 둥근 띠 배경 하단 메세지
            const footerY = imgY + sourceImage.height + 60;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            roundRect(ctx, canvas.width/2 - 250, footerY - 40, 500, 60, 30, true, false);
            ctx.font = 'bold 26px sans-serif';
            ctx.fillStyle = '#475569';
            ctx.fillText("맛있는 급식 먹고 건강하게! 😋", canvas.width / 2, footerY);
            // 💾 화면이 갱신될 때마다 현재 식단 상태를 로컬 스토리지에 자동 저장
            const dateKey = document.getElementById('date-picker').value || 'default';
  localStorage.setItem('ai_result_' + dateKey, JSON.stringify(currentAnnotations));
        }

        function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            if (fill) ctx.fill();
            if (stroke) ctx.stroke();
        }

        // --- 6. 텍스트 직접 수정 ---
        const canvas = document.getElementById('result-canvas');
        const inputOverlay = document.getElementById('canvas-overlay-input');
        let editingItem = null, editingType = null;

        canvas.addEventListener('click', e => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clickX = (e.clientX - rect.left) * scaleX;
            const clickY = (e.clientY - rect.top) * scaleY;

            let found = false;
            for (let anno of currentAnnotations) {
                if (Math.abs(clickX - anno.renderX) < 100 && Math.abs(clickY - anno.renderY) < 40) {
                    showInputOverlay(anno, 'name', e.clientX, e.clientY); found = true; break;
                } else if (Math.abs(clickX - anno.renderX) < 120 && Math.abs(clickY - (anno.renderY + 40)) < 50) {
                    showInputOverlay(anno, 'desc', e.clientX, e.clientY); found = true; break;
                }
            }
            if(!found) inputOverlay.style.display = 'none';
        });

        function showInputOverlay(anno, type, clientX, clientY) {
            editingItem = anno; editingType = type;
            inputOverlay.value = type === 'name' ? anno.name : anno.desc;
            inputOverlay.style.left = (clientX - 50) + 'px';
            inputOverlay.style.top = (clientY - 20) + 'px';
            inputOverlay.style.display = 'block';
            inputOverlay.focus();
        }

        inputOverlay.addEventListener('blur', () => {
            if (editingItem && editingType) {
                if(editingType === 'name') editingItem.name = inputOverlay.value;
                if(editingType === 'desc') editingItem.desc = inputOverlay.value;
                inputOverlay.style.display = 'none';
                renderCanvas(); updateMenuItemsList();
            }
        });
        inputOverlay.addEventListener('keypress', e => { if (e.key === 'Enter') inputOverlay.blur(); });

        // --- 7. 항목 관리 ---
        function updateMenuItemsList() {
            const listDiv = document.getElementById('menu-items-list');
            listDiv.innerHTML = '';
            currentAnnotations.forEach(anno => {
                listDiv.innerHTML += `
                    <div class="bg-white border border-green-200 rounded-full px-4 py-1 flex items-center shadow-sm">
                        <span class="text-sm font-bold text-gray-700 mr-2">✏️ ${anno.name}</span>
                        <button onclick="removeMenuItem(${anno.id})" class="text-red-400 hover:text-red-600">✕</button>
                    </div>`;
            });
        }
        window.removeMenuItem = id => { currentAnnotations = currentAnnotations.filter(a => a.id !== id); renderCanvas(); updateMenuItemsList(); }
        window.addMenuItem = () => {
            currentAnnotations.push({ id: Date.now(), name: "새 메뉴", desc: "간단한 설명을 적어주세요.", x: 0, y: 0 });
            renderCanvas(); updateMenuItemsList();
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.download = 'school_meal.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
